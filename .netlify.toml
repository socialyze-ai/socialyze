[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  SKIP_OPTIONAL_DEPENDENCY_INSTALLATION = "true"
  NODE_VERSION = "18"

[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = ["frontend/.npm", "frontend/node_modules/.cache"]